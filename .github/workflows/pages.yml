name: Deploy Quant City to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "quant-city/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify AI backend
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            https://quant-game.angela-tech.com/api/status \
            | jq -e '.mode == "available" and .model == "deepseek-flash"'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quant-city/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
